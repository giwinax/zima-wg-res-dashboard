<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZimaBlade Dashboard</title>
<style>
  :root {
    --bg: #0b0e13;
    --panel: #12161d;
    --panel-2: #171c25;
    --border: #232a36;
    --text: #e6e9ef;
    --muted: #8a94a6;
    --accent: #4fd1c5;
    --warn: #f0b64c;
    --bad: #f06464;
    --good: #4fd17a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(1200px 800px at 10% -10%, #141a24 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: 24px;
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 18px 2px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--good);
    box-shadow: 0 0 8px var(--good);
  }
  .dot.off { background: var(--bad); box-shadow: 0 0 8px var(--bad); }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  .card {
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
  }
  .card .label {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 10px;
  }
  .card .value {
    font-size: 30px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .card .sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }
  .bar {
    margin-top: 12px;
    height: 6px;
    border-radius: 3px;
    background: #202733;
    overflow: hidden;
  }
  .bar > div {
    height: 100%;
    background: var(--accent);
    transition: width .4s ease;
  }
  .bar.warn > div { background: var(--warn); }
  .bar.bad > div { background: var(--bad); }
  .wide {
    grid-column: span 2;
  }
  @media (max-width: 900px) { .wide { grid-column: span 2; } }
  .section-title {
    margin: 26px 2px 12px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }
  th, td {
    text-align: left;
    padding: 12px 16px;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
  }
  th {
    color: var(--muted);
    font-weight: 500;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    background: var(--panel-2);
  }
  tr:last-child td { border-bottom: none; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
  }
  .badge.online { background: rgba(79,209,122,.12); color: var(--good); }
  .badge.offline { background: rgba(138,148,166,.12); color: var(--muted); }
  .mono { font-variant-numeric: tabular-nums; color: var(--muted); }
  canvas { display: block; width: 100%; height: 48px; margin-top: 10px; }
  footer { margin-top: 20px; font-size: 12px; color: var(--muted); text-align: right; }
</style>
</head>
<body>

<h1><span class="dot" id="conn-dot"></span> ZimaBlade · realtime</h1>

<div class="grid">
  <div class="card">
    <div class="label">CPU</div>
    <div class="value" id="cpu-val">—</div>
    <div class="bar" id="cpu-bar"><div style="width:0%"></div></div>
  </div>
  <div class="card">
    <div class="label">RAM</div>
    <div class="value" id="mem-val">—</div>
    <div class="sub" id="mem-sub">—</div>
    <div class="bar" id="mem-bar"><div style="width:0%"></div></div>
  </div>
  <div class="card">
    <div class="label">Температура</div>
    <div class="value" id="temp-val">—</div>
    <div class="sub" id="temp-sub">CPU zone</div>
  </div>
  <div class="card">
    <div class="label">WireGuard</div>
    <div class="value" id="wg-val">—</div>
    <div class="sub" id="wg-sub">online / всего</div>
  </div>
  <div class="card wide">
    <div class="label">Сеть — <span id="net-iface">eth0</span></div>
    <div class="value" id="net-val">↓ — / ↑ —</div>
    <canvas id="net-chart"></canvas>
  </div>
  <div class="card wide">
    <div class="label">Загрузка CPU — история</div>
    <canvas id="cpu-chart"></canvas>
  </div>
</div>

<div class="section-title">WireGuard клиенты</div>
<table>
  <thead>
    <tr><th>Имя</th><th>Статус</th><th>Адрес</th><th>Последний handshake</th><th>RX</th><th>TX</th></tr>
  </thead>
  <tbody id="wg-table"><tr><td colspan="6" class="mono">загрузка…</td></tr></tbody>
</table>

<footer id="last-update">—</footer>

<script src="app.js"></script>
</body>
</html>
